name: Deliver source suggestions

on:
  workflow_dispatch:
    inputs:
      archive_ids:
        description: Identifiants des propositions intégrées à retirer, séparés par des virgules (facultatif)
        type: string
        default: ''
  schedule:
    - cron: '27 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/source-suggestions.yml'
      - 'scripts/notify_source_suggestions.py'
      - 'tests/test_source_suggestions.py'

permissions:
  contents: read

concurrency:
  group: source-suggestion-delivery
  cancel-in-progress: false

jobs:
  notify:
    if: vars.SOURCE_SUGGESTIONS_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: email-alerts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install requests==2.34.2 pytest==8.4.2
      - run: python -m pytest -q tests/test_source_suggestions.py
      - name: Remove implemented proposals when explicitly requested by the owner
        if: github.event_name == 'workflow_dispatch' && inputs.archive_ids != ''
        env:
          SOURCE_SUGGESTIONS_TOKEN: ${{ secrets.SOURCE_SUGGESTIONS_TOKEN }}
          SOURCE_ARCHIVE_IDS: ${{ inputs.archive_ids }}
        run: python scripts/notify_source_suggestions.py --archive
      - name: Collect private suggestions and reuse existing SMTP
        env:
          SOURCE_SUGGESTIONS_TOKEN: ${{ secrets.SOURCE_SUGGESTIONS_TOKEN }}
          INTERNSHIPS_ALERT_EMAIL_TO: ${{ secrets.INTERNSHIPS_ALERT_EMAIL_TO }}
          INTERNSHIPS_ALERT_EMAIL_FROM: ${{ secrets.INTERNSHIPS_ALERT_EMAIL_FROM }}
          INTERNSHIPS_SMTP_HOST: ${{ secrets.INTERNSHIPS_SMTP_HOST }}
          INTERNSHIPS_SMTP_PORT: ${{ secrets.INTERNSHIPS_SMTP_PORT }}
          INTERNSHIPS_SMTP_USERNAME: ${{ secrets.INTERNSHIPS_SMTP_USERNAME }}
          INTERNSHIPS_SMTP_PASSWORD: ${{ secrets.INTERNSHIPS_SMTP_PASSWORD }}
          INTERNSHIPS_SMTP_SECURITY: ${{ secrets.INTERNSHIPS_SMTP_SECURITY }}
        run: python scripts/notify_source_suggestions.py
