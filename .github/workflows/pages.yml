name: Collect and publish public offers

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7 0,2,6-22/2 * * *'
      timezone: Europe/Paris

permissions:
  contents: read

concurrency:
  group: public-offers-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      INTERNSHIPS_DATA_DIR: ${{ github.workspace }}/.collection-cache
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/github-pages/requirements.txt pytest
      - name: Check public export boundaries
        run: python -m pytest -q tests/test_pages_export.py
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .collection-cache
          key: public-career-feeds-v1-${{ github.run_id }}
          restore-keys: public-career-feeds-v1-
      - name: Install background browser
        run: python -m playwright install --with-deps chromium
      - name: Collect public employer offers and build static site
        if: github.event_name != 'workflow_dispatch'
        run: python scripts/build_internships_pages.py --collect --output _site
      - name: Manually refresh all public sources and build static site
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/build_internships_pages.py --collect --force --output _site
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .collection-cache
          key: public-career-feeds-v1-${{ github.run_id }}
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: _site
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified static artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
